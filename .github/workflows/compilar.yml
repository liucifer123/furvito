name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zlib1g-dev openjdk-17-jdk unzip libffi-dev libssl-dev autoconf libtool pkg-config patch

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Compilar APK con Buildozer
        run: |
          buildozer android debug

      - name: Subir APK Generado
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
